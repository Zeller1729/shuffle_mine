<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ゲームポータル</title>
    <style>
      :root {
        --bg-color: #f8fafc;
        --text-color: #1e293b;
        --card-bg: #ffffff;
        --primary-color: #4f46e5;
        --secondary-color: #0ea5e9;
      }

      body {
        font-family:
          "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        max-width: 800px;
        width: 100%;
        padding: 20px;
        text-align: center;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        color: #0f172a;
      }

      .subtitle {
        color: #64748b;
        margin-bottom: 40px;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 30px;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #e2e8f0;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow:
          0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -4px rgba(0, 0, 0, 0.1);
      }

      .card h2 {
        font-size: 1.5rem;
        margin: 0 0 10px 0;
      }

      .card p {
        font-size: 0.95rem;
        color: #64748b;
        margin: 0 0 20px 0;
        flex-grow: 1;
      }

      .btn {
        padding: 10px 20px;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        font-size: 0.9rem;
      }

      /* 各カードのアクセントカラー */
      .card-guesser h2 {
        color: var(--primary-color);
      }
      .card-guesser .btn {
        background-color: var(--primary-color);
      }

      .card-shuffle h2 {
        color: var(--secondary-color);
      }
      .card-shuffle .btn {
        background-color: var(--secondary-color);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Webゲームポータル</h1>
      <p class="subtitle">
        プレイしたいゲームを選択してください（新しいタブで開きます）
      </p>

      <div class="menu-grid">
        <a
          href="./guesser.html"
          target="_blank"
          rel="noopener noreferrer"
          class="card card-guesser"
        >
          <h2>言葉推測ゲーム</h2>
          <p>
            CSVリストを読み込んで、解答となる<br/>言葉を推測して当てるゲームです。
          </p>
          <div class="btn">ゲームをプレイ</div>
        </a>

        <a
          href="./shufflemine.html"
          target="_blank"
          rel="noopener noreferrer"
          class="card card-shuffle"
        >
          <h2>シャッフルマインスイーパー</h2>
          <p>確率で配置がシャッフルされる<br />マインスイーパーです。</p>
          <div class="btn">ゲームをプレイ</div>
        </a>
      </div>
    </div>
  </body>
</html>
